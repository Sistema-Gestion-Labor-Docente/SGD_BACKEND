<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reporte de Estadisticas</title>
  <style>
    :root {
      --font-base: "Georgia", "Times New Roman", serif;
      --text: #1f2933;
      --muted: #5f6c7b;
      --accent: #0f4c5c;
      --border: #d9e2ec;
      --bg: #ffffff;
      --panel: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 56px;
      font-family: var(--font-base);
      color: var(--text);
      background: var(--bg);
    }
    .header {
      border-bottom: 2px solid var(--accent);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }
    .title {
      font-size: 26px;
      margin: 0 0 6px 0;
      letter-spacing: 0.4px;
    }
    .subtitle {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
    }
    .meta {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .section {
      margin: 24px 0 28px 0;
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      page-break-inside: avoid;
    }
    .section-title {
      margin: 0 0 6px 0;
      font-size: 18px;
      color: var(--accent);
    }
    .section-detail {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .section-label {
      color: var(--accent);
      font-weight: 600;
    }
    .chart {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      background: #fff;
    }
    .chart img {
      max-width: 100%;
      height: auto;
    }
    .footer {
      border-top: 1px solid var(--border);
      margin-top: 30px;
      padding-top: 10px;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">{{REPORTE_TITULO}}</h1>
    <p class="subtitle">{{REPORTE_SUBTITULO}}</p>
    <div class="meta">{{REPORTE_META}}</div>
  </div>

  {{REPORTE_SECCIONES}}

  <div class="footer">{{REPORTE_FOOTER}}</div>
</body>
</html>
