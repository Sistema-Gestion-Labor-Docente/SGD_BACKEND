spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: America/Bogota
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:sgd}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: ${LIQUIBASE_CHANGELOG:classpath:db/changelog/db.changelog-master.xml}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}

  notification:
    service:
      url: ${NOTIFICATION_SERVICE_URL}
    cron: ${NOTIFICACION_CRON:0 0 10 * * *}
    habilitada: ${NOTIFICACION_HABILITADA:false}
    dias:
      min: ${NOTIFICACION_DIAS_MIN:0}
      max: ${NOTIFICACION_DIAS_MAX:5}
  periodo-academico:
    api:
      url: ${PERIODO_ACADEMICO_API_URL}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/sgd-back}

files:
  basePath: ${FILES_BASE_PATH}

document:
  upload-dir: ${DOCUMENT_UPLOAD_DIR}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    'co.edu.unicauca.sed.api': ${LOG_LEVEL_API:INFO}
    liquibase: ${LOG_LEVEL_LIQUIBASE:INFO}

app:
  jwtSecret: ${JWT_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: method
  default-produces-media-type: application/json

info:
  app:
    title: Microservicio Sistema Gestion Docente
    description: API para Gestión de Labor Docente
    version: 1.0.0
