spring:
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: ${LIQUIBASE_CHANGELOG:classpath:db/changelog/db.changelog-master.xml}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}
  notification:
    service:
      url: ${NOTIFICATION_SERVICE_URL}
    cron: ${NOTIFICACION_CRON:0 0 10 * * *}
    habilitada: ${NOTIFICACION_HABILITADA:false}
    dias:
      min: ${NOTIFICACION_DIAS_MIN:0}
      max: ${NOTIFICACION_DIAS_MAX:5}

files:
  basePath: ${FILES_BASE_PATH:/app/uploads}

document:
  upload-dir: ${DOCUMENT_UPLOAD_DIR:/app/uploads}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    'co.edu.unicauca.sed.api': ${LOG_LEVEL_API:INFO}
    liquibase: ${LOG_LEVEL_LIQUIBASE:INFO}
